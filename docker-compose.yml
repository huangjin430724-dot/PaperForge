services:
  paperforge:
    build:
      context: .
    image: paperforge:local
    env_file:
      - path: .env
        required: false
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      PORT: 8787
      PaperForge_TUNNEL: "false"
      PaperForge_DATA_DIR: /app/data
    volumes:
      - paperforge-data:/app/data
    restart: unless-stopped

volumes:
  paperforge-data:
