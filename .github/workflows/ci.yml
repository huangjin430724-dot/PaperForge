name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Check figure assets
        run: npm run check:figures

      - name: Seed demo project
        run: PaperForge_DATA_DIR=.tmp/ci-demo npm run seed:demo

      - name: Check seeded demo figure assets
        run: node scripts/check-figure-assets.mjs .tmp/ci-demo/demo-paperforge-showcase --require

      - name: Backup and restore seeded demo data
        run: |
          npm run backup:data -- --data-dir .tmp/ci-demo --out .tmp/ci-demo-backup.tgz
          node scripts/backup-data.mjs list --file .tmp/ci-demo-backup.tgz
          npm run restore:data -- --file .tmp/ci-demo-backup.tgz --data-dir .tmp/ci-demo-restored --replace
          node scripts/check-figure-assets.mjs .tmp/ci-demo-restored/demo-paperforge-showcase --require

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run e2e
