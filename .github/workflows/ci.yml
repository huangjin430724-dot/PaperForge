name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Check figure assets
        run: npm run check:figures

      - name: Check documentation links
        run: npm run docs:check

      - name: Check dependency metadata
        run: npm run deps:check

      - name: Check dependency licenses
        run: npm run licenses:check

      - name: Validate environment template
        run: npm run env:check

      - name: Security scan
        run: npm run security:scan

      - name: Validate diagnostics bundle
        run: npm run diagnostics:check

      - name: Check project maturity
        run: npm run maturity:check

      - name: Generate project status report
        run: npm run status:report -- --out-dir .tmp/status-report

      - name: Generate release notes
        run: npm run release:notes -- --out-dir .tmp/release-notes

      - name: Check demo project workflow
        run: npm run demo:check -- --work-dir .tmp/ci-demo-check

      - name: Create and verify release bundle
        run: |
          npm run release:bundle -- --out-dir .tmp/release
          npm run release:verify -- --file .tmp/release/PaperForge-0.1.0.tgz

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run e2e
