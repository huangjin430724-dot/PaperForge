name: Bug report
description: Report a reproducible problem in PaperForge.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve PaperForge. Please include enough detail for us to reproduce the issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: Describe the bug in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the exact steps that trigger the bug.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead? Include logs or screenshots if useful.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Node 20, Chrome 126, PaperForge commit ...
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics bundle
      description: Run `npm --silent run diagnostics -- --stdout` and paste the sanitized JSON here. Do not paste API keys or private manuscript content.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      render: shell
